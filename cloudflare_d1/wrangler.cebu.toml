[[d1_databases]]
binding = "DB"
database_name = "d1_eportal_attendance_cebu"
database_id = "c73b198b-a50a-4399-bc4e-9cc1662127bf"

[vars]
# Store BACKUP_TOKEN with: wrangler secret put BACKUP_TOKEN --config wrangler.cebu.toml
